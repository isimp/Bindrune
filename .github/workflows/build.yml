name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # lib/ holds metadata-only copies of everything the project references, Jotunn included,
      # so a build server needs no Valheim install and no download step. See
      # tools/strip-references.ps1.
      - name: Build
        run: dotnet build -c Release -p:LibsDir=lib --nologo

      # Bindrune and Keepsake read a file of each other's, and both repositories hold identical
      # samples of the two formats in tests/contract. A difference means one side changed a
      # format without the other. The tests that check each side against the samples run
      # locally, since they need a BepInEx.dll this repository does not ship.
      - name: Check the shared contract matches Keepsake's
        run: |
          set -euo pipefail
          for file in keepsake.pins bindrune.keys; do
            if ! curl -fsSL "https://raw.githubusercontent.com/isimp/Keepsake/main/tests/contract/$file" -o "/tmp/$file"; then
              echo "::warning::Could not fetch Keepsake's tests/contract/$file, so it was not compared."
              continue
            fi
            if ! diff -u "/tmp/$file" "tests/contract/$file"; then
              echo "::error::tests/contract/$file differs from Keepsake's copy. Change the format in both mods together."
              exit 1
            fi
          done
          echo "contract matches"

      - uses: actions/upload-artifact@v4
        with:
          name: Bindrune
          path: bin/Release/Bindrune.dll
          if-no-files-found: error
